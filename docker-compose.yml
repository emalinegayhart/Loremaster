# Local dev stack: Postgres, Elasticsearch and the backend.
#
#   docker compose up --build              # start everything
#   docker compose run --rm seed           # load sample pages into Postgres + ES
#
# Credentials come from your shell or .env; anything unset falls back to a dummy
# value so the app can start. Chat needs a real ANTHROPIC_API_KEY.

x-backend-env: &backend-env
  DATABASE_URL: postgresql://loremaster:loremaster@db:5432/loremaster
  NEON_CONNECTION_STRING: postgresql://loremaster:loremaster@db:5432/loremaster
  ES_ENDPOINT: http://elasticsearch:9200
  ES_API_KEY: ""
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-dev}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-local-dev}
  GOOGLE_REDIRECT_URI: http://localhost:8080/api/auth/google/callback
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-jwt-secret-at-least-32-chars}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  FRONTEND_URL: http://localhost:5173

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: loremaster
      POSTGRES_PASSWORD: loremaster
      POSTGRES_DB: loremaster
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "loremaster"]
      interval: 2s
      retries: 30

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # search uses RRF, which the basic license doesn't include
      xpack.license.self_generated.type: trial
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:9200/_cluster/health"]
      interval: 5s
      retries: 30

  backend:
    build: .
    environment: *backend-env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  seed:
    build: .
    profiles: [seed]
    command: python loader.py --input tests/fixtures/sample_pages.jsonl
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

volumes:
  pgdata:
  esdata:
